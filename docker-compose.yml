services:
  idena-node:
    image: rinzlerfr/idena-node:latest
    container_name: idena-node
    restart: unless-stopped
    environment:
      IDENA_USER_ACCOUNT_NAME: idenaUser
      IDENA_USER_ACCOUNT_PASS: changeMe
      RUN_TIMEOUT: 86400
    ports:
      - "${IDENA_SSH_HOST_PORT:-60022}:22"
      - "${IDENA_P2P_HOST_PORT:-40405}:40405"
      - "${IDENA_API_HOST_PORT:-9999}:9009"
    volumes:
      - idena-node-data:/datadir

volumes:
  idena-node-data:
