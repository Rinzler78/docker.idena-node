services:
  idena-node:
    image: ${IDENA_IMAGE_NAME:-idena-node:compose-local}
    build:
      context: .
    container_name: idena-node
    restart: unless-stopped
    environment:
      IDENA_USER_ACCOUNT_NAME: ${IDENA_USER_ACCOUNT_NAME:-idenaUser}
      IDENA_USER_ACCOUNT_PASS: ${IDENA_USER_ACCOUNT_PASS:?Set IDENA_USER_ACCOUNT_PASS in your environment or .env file}
      RUN_TIMEOUT: ${RUN_TIMEOUT:-86400}
    ports:
      - "${IDENA_SSH_HOST_PORT:-60022}:22"
      - "${IDENA_P2P_HOST_PORT:-40405}:40405"
      - "${IDENA_API_HOST_PORT:-9999}:9009"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 127.0.0.1 22 </dev/null >/dev/null 2>&1 && nc -w1 127.0.0.1 9009 </dev/null >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    volumes:
      - idena-node-data:/datadir

volumes:
  idena-node-data:
